<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Uber vs Taxi</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚕</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Russo+One&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <nav class="nav">
    <div class="nav-left"></div>
    <a class="logo" href="/"><span class="l-uber">UBER</span><span class="l-vs">vs</span><span class="l-taxi">TAXI</span></a>
    <div class="nav-right">
      <a class="nav-btn" href="/login">Iniciar sesión</a>
      <a class="nav-btn primary" href="/register">Registrarse</a>
    </div>
  </nav>

  <main class="container">
    <header class="hero">
      <div class="side side-uber">
        <svg viewBox="0 0 122 50" aria-hidden="true">
          <path d="M8 34 Q8 26 16 25 L34 23 L46 12 Q49 9 54 9 L80 9 Q85 9 88 13 L97 23 L108 25 Q114 26 114 32 L114 36 Q114 38 112 38 L10 38 Q8 38 8 36 Z" fill="#2a2d36"/>
          <path d="M38 23 L48 13 Q50 12 53 12 L64 12 L64 23 Z M68 12 L80 12 Q83 12 85 15 L92 23 L68 23 Z" fill="#7fe9c6" opacity=".55"/>
          <rect x="108" y="27" width="6" height="3" rx="1.5" fill="#fff"/>
          <rect x="8" y="27" width="4" height="3" rx="1.5" fill="#ff5d5d"/>
          <circle cx="30" cy="38" r="9" fill="#0a0a0a"/><circle cx="30" cy="38" r="4" fill="#8a8f9c"/>
          <circle cx="92" cy="38" r="9" fill="#0a0a0a"/><circle cx="92" cy="38" r="4" fill="#8a8f9c"/>
        </svg>
        <p class="brand">UBER</p>
        <p class="tag">La app. El algoritmo. La tarifa dinámica.</p>
      </div>
      <div class="vs">VS</div>
      <div class="side side-taxi">
        <svg viewBox="0 0 122 50" aria-hidden="true">
          <rect x="54" y="1" width="20" height="8" rx="2" fill="#0a0a0a"/>
          <text x="64" y="7.2" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="5.5" fill="#ffc928">TAXI</text>
          <path d="M8 34 Q8 26 16 25 L34 23 L46 12 Q49 9 54 9 L80 9 Q85 9 88 13 L97 23 L108 25 Q114 26 114 32 L114 36 Q114 38 112 38 L10 38 Q8 38 8 36 Z" fill="#ffd54d" stroke="#0a0a0a" stroke-width="1.5"/>
          <path d="M38 23 L48 13 Q50 12 53 12 L64 12 L64 23 Z M68 12 L80 12 Q83 12 85 15 L92 23 L68 23 Z" fill="#1d2230"/>
          <rect x="14" y="28" width="96" height="4" fill="#0a0a0a" opacity=".85"/>
          <rect x="108" y="27" width="6" height="3" rx="1.5" fill="#fff"/>
          <circle cx="30" cy="38" r="9" fill="#0a0a0a"/><circle cx="30" cy="38" r="4" fill="#c9ccd4"/>
          <circle cx="92" cy="38" r="9" fill="#0a0a0a"/><circle cx="92" cy="38" r="4" fill="#c9ccd4"/>
        </svg>
        <p class="brand">TAXI</p>
        <p class="tag">El taxímetro. La calle. La experiencia.</p>
      </div>
    </header>

    <p class="subtitle">Elige tu volante y entra al lobby. La ciudad se disputa esquina por esquina.</p>

    <div id="banner" class="msg hidden"></div>
  </main>

  <div class="road" aria-hidden="true">
    <svg class="car car-uber" viewBox="0 0 122 50"><path d="M8 34 Q8 26 16 25 L34 23 L46 12 Q49 9 54 9 L80 9 Q85 9 88 13 L97 23 L108 25 Q114 26 114 32 L114 36 Q114 38 112 38 L10 38 Q8 38 8 36 Z" fill="#2a2d36" stroke="#4a4f5c"/><path d="M38 23 L48 13 Q50 12 53 12 L64 12 L64 23 Z M68 12 L80 12 Q83 12 85 15 L92 23 L68 23 Z" fill="#7fe9c6" opacity=".55"/><rect x="108" y="27" width="6" height="3" rx="1.5" fill="#fff"/><circle cx="30" cy="38" r="9" fill="#0a0a0a"/><circle cx="92" cy="38" r="9" fill="#0a0a0a"/></svg>
    <svg class="car car-taxi" viewBox="0 0 122 50"><rect x="54" y="1" width="20" height="8" rx="2" fill="#0a0a0a"/><path d="M8 34 Q8 26 16 25 L34 23 L46 12 Q49 9 54 9 L80 9 Q85 9 88 13 L97 23 L108 25 Q114 26 114 32 L114 36 Q114 38 112 38 L10 38 Q8 38 8 36 Z" fill="#ffd54d" stroke="#0a0a0a" stroke-width="1.5"/><path d="M38 23 L48 13 Q50 12 53 12 L64 12 L64 23 Z M68 12 L80 12 Q83 12 85 15 L92 23 L68 23 Z" fill="#1d2230"/><rect x="108" y="27" width="6" height="3" rx="1.5" fill="#fff"/><circle cx="30" cy="38" r="9" fill="#0a0a0a"/><circle cx="92" cy="38" r="9" fill="#0a0a0a"/></svg>
  </div>

  <script src="/config.js"></script>
  <script src="/common.js"></script>
</body>
</html>
