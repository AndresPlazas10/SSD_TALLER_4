<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Uber vs Taxi · Iniciar sesión</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚕</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Russo+One&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <nav class="nav">
    <div class="nav-left"></div>
    <a class="logo" href="/"><span class="l-uber">UBER</span><span class="l-vs">vs</span><span class="l-taxi">TAXI</span></a>
    <div class="nav-right">
      <a class="nav-btn" href="/login" aria-current="page">Iniciar sesión</a>
      <a class="nav-btn primary" href="/register">Registrarse</a>
    </div>
  </nav>

  <main class="container narrow form-page">
    <h1>🔑 Iniciar sesión</h1>
    <p class="lead">¿Ya tienes licencia? Arranca el motor.</p>

    <div id="banner" class="msg hidden"></div>

    <form id="login-form" class="card card-taxi">
      <label for="login-username">Usuario</label>
      <input id="login-username" autocomplete="username" placeholder="tu_usuario" required />
      <label for="login-password">Contraseña</label>
      <input id="login-password" type="password" autocomplete="current-password" placeholder="••••••••" required />
      <button type="submit">Entrar al lobby</button>
    </form>

    <p class="switch">¿No tienes cuenta? <a href="/register">Regístrate aquí</a></p>
  </main>

  <div class="road" aria-hidden="true">
    <svg class="car car-uber" viewBox="0 0 122 50"><path d="M8 34 Q8 26 16 25 L34 23 L46 12 Q49 9 54 9 L80 9 Q85 9 88 13 L97 23 L108 25 Q114 26 114 32 L114 36 Q114 38 112 38 L10 38 Q8 38 8 36 Z" fill="#2a2d36" stroke="#4a4f5c"/><path d="M38 23 L48 13 Q50 12 53 12 L64 12 L64 23 Z M68 12 L80 12 Q83 12 85 15 L92 23 L68 23 Z" fill="#7fe9c6" opacity=".55"/><rect x="108" y="27" width="6" height="3" rx="1.5" fill="#fff"/><circle cx="30" cy="38" r="9" fill="#0a0a0a"/><circle cx="92" cy="38" r="9" fill="#0a0a0a"/></svg>
    <svg class="car car-taxi" viewBox="0 0 122 50"><rect x="54" y="1" width="20" height="8" rx="2" fill="#0a0a0a"/><path d="M8 34 Q8 26 16 25 L34 23 L46 12 Q49 9 54 9 L80 9 Q85 9 88 13 L97 23 L108 25 Q114 26 114 32 L114 36 Q114 38 112 38 L10 38 Q8 38 8 36 Z" fill="#ffd54d" stroke="#0a0a0a" stroke-width="1.5"/><path d="M38 23 L48 13 Q50 12 53 12 L64 12 L64 23 Z M68 12 L80 12 Q83 12 85 15 L92 23 L68 23 Z" fill="#1d2230"/><rect x="108" y="27" width="6" height="3" rx="1.5" fill="#fff"/><circle cx="30" cy="38" r="9" fill="#0a0a0a"/><circle cx="92" cy="38" r="9" fill="#0a0a0a"/></svg>
  </div>

  <script src="/config.js"></script>
  <script src="/common.js"></script>
  <script>
    // Si viene de /register, rellenar el usuario recién creado
    try {
      const prefill = sessionStorage.getItem('prefill-username');
      if (prefill) {
        document.getElementById('login-username').value = prefill;
        document.getElementById('login-password').focus();
        sessionStorage.removeItem('prefill-username');
      }
    } catch (_) {}

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      try {
        const { status, data } = await authPost('/login', { username, password });
        if (status === 200) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('username', data.username);
          window.location.replace('/lobby'); // Atrás desde el lobby no vuelve al formulario
        } else {
          show(data.error || `Error ${status}`, 'error');
        }
      } catch (err) {
        show('No se pudo contactar el servicio de autenticación', 'error');
      }
    });
  </script>
</body>
</html>
